name: ecclesiasdrive CI

on: [push]

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: pwsh

jobs:
# ------------------------------------------------------------------------------------------------------------------------------------------
  build:
    permissions:
      # actions/upload-artifact doesn't need contents: write
      contents: read
    strategy:
        fail-fast: true
        matrix:
            include:
            - name: windows-cl-x86_64
              target: windows-cl-msvc2022-x86_64
              os: windows-latest
              container:
              useSonarCloud:
            # TODO: align the target with the name
            - name: macos-clang-arm64
              target: macos-clang-arm64
              os: macos-latest
              container:
              useSonarCloud:
            - name: linux-gcc-x86_64
              target: linux-64-gcc
              os: ubuntu-latest
              container: owncloudci/appimage-build:sles15-amd64
              useSonarCloud:
    name: ${{ matrix.name }}

    runs-on: ${{ matrix.os }}

    env:
      CRAFT_TARGET: ${{ matrix.target }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      APP_VERSION: "6.0.3.0"
      APP_NAME: "ecclesiasdrive"

    container: ${{ matrix.container }}

    steps:
    - name: Check out full source code for tooling
      if: ${{ matrix.useSonarCloud || matrix.name  == 'linux-gcc-x86_64' }}
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Check out latest commit
      if: ${{ !matrix.useSonarCloud && matrix.name  != 'linux-gcc-x86_64' }}
      uses: actions/checkout@v6

    - uses: actions/setup-python@v5
      if: matrix.name  == 'windows-cl-x86_64'
      with:
        python-version: '3.12'

    - name: Restore cache
      uses: actions/cache@v4
      with:
        path: ~/cache
        key: ${{ runner.os }}-${{ matrix.target }}

    - name: Clone CraftMaster
      run: git clone --depth=1 https://invent.kde.org/kde/craftmaster.git "$env:HOME/craft/CraftMaster/CraftMaster"

    - name: Craft setup
      run: |
        New-Item -Path ~/cache -ItemType Directory -ErrorAction SilentlyContinue
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" --setup

    - name: Craft unshelve
      run: |
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --unshelve "${env:GITHUB_WORKSPACE}/.craft.shelf"

    - name: Prepare
      run: |
        New-Item -ItemType Directory "${env:GITHUB_WORKSPACE}/binaries/"
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --set forceAsserts=true ecclesiasdrive/ecclesiasdrive-client
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --set srcDir="${env:GITHUB_WORKSPACE}" ecclesiasdrive/ecclesiasdrive-client
        if ($IsWindows) {
            & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c dev-utils/nsis
        } elseif($IsLinux) {
            & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c dev-utils/linuxdeploy
        }

    - name: Install dependencies
      run: |
          if ("${{ matrix.target }}" -eq "linux-64-gcc" ) {
              # build with appimage updater and others
              & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --set enableAppImageUpdater=false ecclesiasdrive-client
              & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --set enableCrashReporter=false ecclesiasdrive/ecclesiasdrive-client
              & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --set enableAutoUpdater=false ecclesiasdrive/ecclesiasdrive-client
          }
          & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --install-deps ecclesiasdrive/ecclesiasdrive-client

    - name: QML format lint
      if: matrix.name  == 'linux-gcc-x86_64'
      run: |
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c libs/qt6/qttools
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --run pwsh -c "git ls-files *.qml | %{ qmlformat -i `$_}"
        $diff = git diff
        if ($diff) {
          $diff
          exit 1
        }

    - name: clang-format format lint
      if: matrix.name  == 'linux-gcc-x86_64'
      run: |
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c libs/llvm
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --run git clang-format --force  ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        $diff = git diff
        if ($diff) {
          $diff
          exit 1
        }

    - name: Build
      if: ${{ !matrix.useSonarCloud }}
      run: |
        if ("${{ matrix.target }}" -eq "linux-64-gcc" ) {
            # build with appimage updater and others
            & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --set enableAppImageUpdater=false ecclesiasdrive-client
            & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --set enableCrashReporter=false ecclesiasdrive/ecclesiasdrive-client
            & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --set enableAutoUpdater=false ecclesiasdrive/ecclesiasdrive-client
        }
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --no-cache ecclesiasdrive/ecclesiasdrive-client

    - name: Build for SonarCloud
      if: ${{ matrix.useSonarCloud }}
      run: |
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --no-cache --configure ecclesiasdrive/ecclesiasdrive-client
        $env:BUILD_DIR = $(& "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --get buildDir -q ecclesiasdrive-client)
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --run pwsh "${env:GITHUB_WORKSPACE}/.github/workflows/.sonar.ps1" --build
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --no-cache --install --qmerge ecclesiasdrive/ecclesiasdrive-client
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --run pwsh "${env:GITHUB_WORKSPACE}/.github/workflows/.sonar.ps1" --analyze

    - name: Run tests
      run: |
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --no-cache --test ecclesiasdrive/ecclesiasdrive-client

    - name: Package
      run: |
        if ("${{ matrix.target }}" -eq "linux-64-gcc" ) {
            # package without crash reporter
            & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --set enableCrashReporter=false ecclesiasdrive/ecclesiasdrive-client
        }
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --no-cache --package ecclesiasdrive/ecclesiasdrive-client

    - name: Build MSI (WiX v3)
      if: matrix.name == 'windows-cl-x86_64'
      run: |
        $env:PATH = "$env:PATH;C:\Program Files (x86)\WiX Toolset v3.14\bin"
        
        $exePath = Get-ChildItem "$env:HOME/craft/binaries/*.exe" |
        Where-Object { $_.Name -notlike "*vc_redist*" } |
        Select-Object -First 1
        
        if (-not $exePath) {
        Write-Error "No .exe found in craft/binaries"
        exit 1
        }
        
        Write-Host "Found exe: $($exePath.FullName)"

        $wxsFile = "${env:GITHUB_WORKSPACE}/.github/workflows/installer.wxs"
        $wixObj  = "D:\installer.wixobj"
        $msiOut  = "D:\${{ env.APP_NAME }}-${{ env.APP_VERSION }}.msi"
        $bannerBmp = "${env:GITHUB_WORKSPACE}/src/resources/theme/universal/banner.bmp"
        $dialogBmp = "${env:GITHUB_WORKSPACE}/src/resources/theme/universal/dialog.bmp"
        
        Write-Host "wxsFile: $wxsFile"
        Write-Host "bannerBmp: $bannerBmp"
        Write-Host "dialogBmp: $dialogBmp"
        Write-Host "wixObj:  $wixObj"
        Write-Host "msiOut:  $msiOut"
        
        candle.exe "-dProductVersion=${{ env.APP_VERSION }}" "-dSourceExe=$($exePath.FullName)" "-dBannerBmp=$bannerBmp" "-dDialogBmp=$dialogBmp" -arch x64 -ext WixUIExtension -o $wixObj $wxsFile
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        light.exe -ext WixUIExtension -o $msiOut $wixObj
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        
        Copy-Item $msiOut "$env:HOME/craft/binaries/"
        Write-Host "MSI produced: $msiOut"

    - name: Prepare artifacts
      run: |
        Copy-Item "$env:HOME/craft/binaries/*" "${env:GITHUB_WORKSPACE}/binaries/" -ErrorAction SilentlyContinue
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --shelve "${env:GITHUB_WORKSPACE}/.craft.shelf"
        Copy-Item "${env:GITHUB_WORKSPACE}/.craft.shelf" "${env:GITHUB_WORKSPACE}/binaries/"

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.APP_NAME }}-${{ env.APP_VERSION }}-${{ matrix.name }}
        path: ${{ github.workspace }}/binaries/*
